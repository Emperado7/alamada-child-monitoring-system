plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alamada.childmonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.alamada.childmonitor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Change this IP when testing on a real device (use your PC's LAN IP)
        buildConfigField "String", "BASE_URL", '"http://10.0.2.2:8000/api/"'
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", '"http://10.0.2.2:8000/api/"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", '"https://your-production-server.com/api/"'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core:1.12.0'

    // ViewPager2 + Fragment (for child detail tabs)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Nested scrolling support
    implementation 'androidx.core:core-ktx:1.12.0'
}
