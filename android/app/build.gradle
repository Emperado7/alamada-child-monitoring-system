plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alamada.childmonitor'
    compileSdk 36

    defaultConfig {
        applicationId "com.alamada.childmonitor"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Live Render URL — works from any device, anywhere
        buildConfigField "String", "BASE_URL", '"https://alamada-child-monitoring-system.onrender.com/api/"'
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", '"https://alamada-child-monitoring-system.onrender.com/api/"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", '"https://alamada-child-monitoring-system.onrender.com/api/"'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.core:core:1.16.0'

    // ViewPager2 + Fragment (for child detail tabs)
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.6'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
