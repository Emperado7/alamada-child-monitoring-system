[variables]
APP_ENV = "production"
PORT = "8080"

[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.ctype",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.gd",
  "php82Extensions.bcmath",
  "php82Extensions.fileinfo",
  "php82Extensions.openssl"
]

[phases.install]
cmds = [
    "cd backend && composer install --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
    "cd backend && php artisan config:cache",
    "cd backend && php artisan route:cache",
    "cd backend && php artisan view:cache"
]

[start]
cmd = "cd backend && php artisan storage:link --force ; php artisan migrate --force ; php artisan db:seed --force --class=DatabaseSeeder ; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
