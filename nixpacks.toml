[variables]
APP_ENV = "production"
PORT = "8080"

[phases.install]
cmds = [
    "cd backend && composer install --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
    "cd backend && php artisan config:cache",
    "cd backend && php artisan route:cache",
    "cd backend && php artisan view:cache"
]

[start]
cmd = "cd backend && php artisan storage:link --force ; php artisan migrate --force ; php artisan db:seed --force --class=DatabaseSeeder ; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
