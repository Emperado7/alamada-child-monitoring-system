[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.ctype",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.gd",
  "php82Extensions.bcmath",
  "php82Extensions.fileinfo",
  "php82Extensions.openssl",
  "composer"
]

[phases.install]
cmds = ["cd backend && composer install --no-dev --optimize-autoloader"]

[start]
# ENV vars (APP_KEY, DB_*, APP_URL) must be set in Railway dashboard.
# They are injected at runtime, so caching happens here not at build time.
cmd = "cd backend && php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan db:seed --force --class=DatabaseSeeder && php artisan serve --host=0.0.0.0 --port=$PORT"
