[variables]
APP_ENV = "production"

# Force nixpacks to use PHP provider
[providers]
php = {}

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.fileinfo", "php82Extensions.openssl", "php82Extensions.curl", "php82Extensions.zip"]

[phases.install]
cmds = [
    "cd backend && composer install --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
    "cd backend && php artisan config:cache || true",
    "cd backend && php artisan route:cache || true",
    "cd backend && php artisan view:cache || true"
]

[start]
cmd = "cd backend && php artisan storage:link --force ; php artisan migrate --force ; php artisan db:seed --force --class=DatabaseSeeder ; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
