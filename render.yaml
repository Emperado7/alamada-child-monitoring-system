services:
  - type: web
    name: alamada-child-monitoring
    env: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_KEY
        value: base64:dN5eYOE6wE//4PaqAFuVDlRcm8t2fL/BmZIz3n6GaMk=
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://alamada-child-monitoring.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        value: alamada-child-monitoring.onrender.com
      - key: SESSION_DOMAIN
        value: .onrender.com
      - key: FILESYSTEM_DISK
        value: public
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: errorlog
      - key: LOG_LEVEL
        value: error
