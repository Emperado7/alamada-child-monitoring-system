name: Build & Release APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Java 17 ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Write local.properties (Android SDK path on CI) ───────────
      - name: Create local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/app/local.properties
          cat android/local.properties

      # ── 4. Gradle permissions ────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # ── 5. Build debug APK ───────────────────────────────────────────
      #    GIT_CONFIG_COUNT=1 + safe.directory=* fixes "git exit code 128"
      #    that Gradle 8+ triggers when running in a CI container.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --no-configuration-cache -x lint
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          # Tell git every directory is safe — affects any git subprocess Gradle spawns
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx2g
            -Dfile.encoding=UTF-8
            -Dorg.gradle.configuration-cache=false

      # ── 6. Prepare APK ───────────────────────────────────────────────
      - name: Prepare APK
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-artifacts/alamada-parent-app.apk
          echo "APK size: $(du -sh release-artifacts/alamada-parent-app.apk)"

      # ── 7. Delete old "latest-apk" release ───────────────────────────
      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk \
            --repo "${{ github.repository }}" --yes 2>/dev/null || true
          git push origin :refs/tags/latest-apk 2>/dev/null || true

      # ── 8. Create new release + upload APK ───────────────────────────
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(date -u '+%B %d, %Y at %H:%M UTC')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release create latest-apk \
            release-artifacts/alamada-parent-app.apk \
            --repo "${{ github.repository }}" \
            --title "Alamada Parent App — Latest Build" \
            --notes "### Alamada LGU Learning Center — Parent Mobile App

          **Built:** ${BUILD_DATE}
          **Commit:** \`${SHORT_SHA}\`

          ---

          #### How to install
          1. Tap **alamada-parent-app.apk** below ↓
          2. Open it on your Android phone
          3. Tap **Install** (allow *Unknown sources* if asked)
          4. Log in with the credentials from the Learning Center

          > Requires Android 7.0 (API 24) or higher" \
            --latest
