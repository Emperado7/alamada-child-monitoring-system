name: Build & Release APK

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle permissions ────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 4. Build debug APK (no signing key required) ─────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 5. Rename APK ────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-artifacts/alamada-parent-app.apk

      # ── 6. Get short commit SHA for release tag ───────────────────────
      - name: Set release tag
        id: tag
        run: echo "tag=latest-apk" >> $GITHUB_OUTPUT

      # ── 7. Delete old "latest-apk" release if it exists ─────────────
      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push origin :refs/tags/latest-apk 2>/dev/null || true

      # ── 8. Create new release and upload APK ─────────────────────────
      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-apk \
            release-artifacts/alamada-parent-app.apk \
            --repo ${{ github.repository }} \
            --title "Alamada Parent App — Latest Build" \
            --notes "**Alamada LGU Learning Center — Parent Mobile App**

          Auto-built from commit \`${{ github.sha }}\` on \`$(date -u '+%Y-%m-%d %H:%M UTC')\`.

          ### Install instructions
          1. Download **alamada-parent-app.apk** below
          2. Open it on your Android phone
          3. Tap **Install** (enable *Unknown sources* if prompted)
          4. Log in with the account provided by the Learning Center

          > Requires Android 7.0 (API 24) or higher." \
            --latest
