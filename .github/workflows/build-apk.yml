name: Build & Release APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ── 2. Fix git safe directory ────────────────────────────────────
      - name: Trust all git directories
        run: git config --global --add safe.directory '*'

      # ── 3. Java 17 ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Cache Gradle dependencies ─────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 5. Write local.properties ────────────────────────────────────
      - name: Create local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      # ── 6. Gradle permissions ────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # ── 8. Build debug APK ───────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Working dir: $(pwd)"
          echo ""
          # Run assembleDebug and capture output
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -x lint \
            -x test
          echo ""
          echo "=== Build complete. Checking outputs ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No .apk found in $(pwd)"
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
            -Dfile.encoding=UTF-8
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
            -Dfile.encoding=UTF-8
            -Dkotlin.incremental=false

      # ── 9. Locate and copy APK ───────────────────────────────────────
      - name: Prepare APK
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "=== Full search for APK ==="
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" 2>/dev/null || echo "No APK found anywhere"
          echo ""
          echo "=== android/app/build tree ==="
          ls -la "$GITHUB_WORKSPACE/android/app/build/" 2>/dev/null || echo "No build dir"
          ls -laR "$GITHUB_WORKSPACE/android/app/build/outputs/" 2>/dev/null || echo "No outputs dir"
          echo ""
          mkdir -p release-artifacts
          APK=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" release-artifacts/alamada-parent-app.apk
            echo "✅ APK: $(ls -lh release-artifacts/alamada-parent-app.apk)"
          else
            echo "❌ No APK found"
            exit 1
          fi

      # ── 10. Upload APK artifact ───────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alamada-parent-app
          path: release-artifacts/alamada-parent-app.apk
          if-no-files-found: error
          retention-days: 90

      # ── 10. Delete old "latest-apk" release ──────────────────────────
      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk \
            --repo "${{ github.repository }}" --yes 2>/dev/null || true
          git push origin :refs/tags/latest-apk 2>/dev/null || true

      # ── 11. Publish GitHub Release + APK ─────────────────────────────
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(date -u '+%B %d, %Y at %H:%M UTC')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release create latest-apk \
            release-artifacts/alamada-parent-app.apk \
            --repo "${{ github.repository }}" \
            --title "Alamada Parent App — Latest Build" \
            --notes "### Alamada LGU Learning Center — Parent Mobile App

          **Built:** ${BUILD_DATE}  |  **Commit:** \`${SHORT_SHA}\`

          #### How to install
          1. Tap **alamada-parent-app.apk** below ↓
          2. Open it on your Android phone
          3. Tap **Install** (allow *Unknown sources* if asked)
          4. Log in with the account from the Learning Center

          > Requires Android 7.0 (API 24) or higher" \
            --latest
