name: Build & Release APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout (skip submodules — we don't need the nested repo) ─
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ── 2. Neutralise git safe.directory for all processes ───────────
      - name: Trust all git directories
        run: |
          git config --global --add safe.directory '*'
          echo "Git global config set"

      # ── 3. Java 17 ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Write local.properties (Android SDK path on CI) ───────────
      - name: Create local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      # ── 5. Gradle permissions ────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # ── 6. Build debug APK ───────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --no-configuration-cache \
            -x lint \
            -x test 2>&1 | tee /tmp/gradle-build.log
          echo "Exit code: $?"
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"

      # ── Show last 100 lines of build log on failure ───────────────────
      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -150 /tmp/gradle-build.log || true
          echo "=== ERRORS ONLY ==="
          grep -i "error\|exception\|cannot\|could not\|failed" /tmp/gradle-build.log | tail -40 || true

      # ── 7. Prepare APK ───────────────────────────────────────────────
      - name: Prepare APK
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-artifacts/alamada-parent-app.apk
          echo "APK size: $(du -sh release-artifacts/alamada-parent-app.apk)"

      # ── 8. Delete old "latest-apk" release ───────────────────────────
      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk \
            --repo "${{ github.repository }}" --yes 2>/dev/null || true
          git push origin :refs/tags/latest-apk 2>/dev/null || true

      # ── 9. Publish release + APK ──────────────────────────────────────
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(date -u '+%B %d, %Y at %H:%M UTC')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release create latest-apk \
            release-artifacts/alamada-parent-app.apk \
            --repo "${{ github.repository }}" \
            --title "Alamada Parent App — Latest Build" \
            --notes "### Alamada LGU Learning Center — Parent Mobile App

          **Built:** ${BUILD_DATE}  |  **Commit:** \`${SHORT_SHA}\`

          #### How to install
          1. Tap **alamada-parent-app.apk** below ↓
          2. Open it on your Android phone
          3. Tap **Install** (allow *Unknown sources* if asked)
          4. Log in with the account from the Learning Center

          > Requires Android 7.0 (API 24) or higher" \
            --latest
