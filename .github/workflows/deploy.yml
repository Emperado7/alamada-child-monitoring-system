name: Deploy to Render

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend to Render
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Trigger Render deploy via Render API ────────────────────────────
      # Requires GitHub Secrets:
      #   RENDER_API_KEY   — Render API key (starts with "rnd_")
      #   RENDER_SERVICE_ID — Render service ID (starts with "srv-")
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "⚠️  RENDER_API_KEY or RENDER_SERVICE_ID not set in GitHub Secrets."
            echo "    Go to: Repo Settings → Secrets and variables → Actions → New repository secret"
            echo "    Add RENDER_API_KEY (your Render API key) and RENDER_SERVICE_ID (your service ID)"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "Response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Deploy ID: $DEPLOY_ID"
          if [ -z "$DEPLOY_ID" ]; then
            echo "❌ Failed to trigger deploy"
            exit 1
          fi
          echo "✅ Deploy triggered: $DEPLOY_ID"
          echo "🔗 Monitor at: https://dashboard.render.com/web/${RENDER_SERVICE_ID}"
