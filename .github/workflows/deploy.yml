name: Deploy to Render

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend to Render
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Trigger Render deploy via Render API ────────────────────────────
      - name: Trigger Render deploy
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/srv-dbevq4on74is73b2cnqg/deploys" \
            -H "Authorization: Bearer rnd_fmSAk65nhK8lllLcJPjmvrTkDtc9" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "Response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Deploy ID: $DEPLOY_ID"
          if [ -z "$DEPLOY_ID" ]; then
            echo "❌ Failed to trigger deploy"
            exit 1
          fi
          echo "✅ Deploy triggered: $DEPLOY_ID"
          echo "🔗 Monitor at: https://dashboard.render.com/web/srv-dbevq4on74is73b2cnqg"
