name: Deploy to Render

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy backend to Render
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set environment variables on Render via API ────────────────────
      - name: Set Render environment variables
        run: |
          curl -sf -X PATCH \
            "https://api.render.com/v1/services/srv-dbevq4on74is73b2cnqg/env-vars" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '[
              {"key":"APP_NAME",  "value":"Alamada LGU Child Monitoring System"},
              {"key":"APP_ENV",   "value":"production"},
              {"key":"APP_DEBUG", "value":"false"},
              {"key":"APP_KEY",   "value":"base64:Pfs3OjH5zbFU+1pdJNkqhSu9eHHlWaaBZGYD9n6trOA="},
              {"key":"APP_URL",   "value":"https://alamada-child-monitoring-system.onrender.com"},
              {"key":"DB_CONNECTION","value":"pgsql"},
              {"key":"DB_HOST",   "value":"aws-0-ap-southeast-1.pooler.supabase.com"},
              {"key":"DB_PORT",   "value":"5432"},
              {"key":"DB_DATABASE","value":"postgres"},
              {"key":"DB_USERNAME","value":"postgres.uladgqimfubazxtcetjb"},
              {"key":"DB_PASSWORD","value":"${{ secrets.DB_PASSWORD }}"},
              {"key":"DB_SSLMODE","value":"require"},
              {"key":"LOG_CHANNEL","value":"errorlog"},
              {"key":"LOG_LEVEL", "value":"error"},
              {"key":"BROADCAST_DRIVER","value":"log"},
              {"key":"CACHE_DRIVER","value":"file"},
              {"key":"FILESYSTEM_DISK","value":"public"},
              {"key":"QUEUE_CONNECTION","value":"sync"},
              {"key":"SESSION_DRIVER","value":"cookie"},
              {"key":"SESSION_LIFETIME","value":"120"},
              {"key":"SESSION_SECURE_COOKIE","value":"true"},
              {"key":"SESSION_DOMAIN","value":"alamada-child-monitoring-system.onrender.com"},
              {"key":"SANCTUM_STATEFUL_DOMAINS","value":"alamada-child-monitoring-system.onrender.com"}
            ]'

      # ── 3. Trigger Render deploy ──────────────────────────────────────────
      - name: Trigger deploy
        run: |
          curl -fsSL -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -w "\nHTTP status: %{http_code}\n"
