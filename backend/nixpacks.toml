[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.ctype",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.gd",
  "php82Extensions.bcmath",
  "php82Extensions.openssl",
  "php82Extensions.fileinfo",
  "php82Extensions.dom",
  "php82Extensions.intl",
  "php82Extensions.redis",
  "composer"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache"
]

[start]
cmd = "php artisan storage:link --force ; php artisan config:cache ; php artisan route:cache ; php artisan migrate --force ; php artisan db:seed --force --class=DatabaseSeeder ; php artisan serve --host=0.0.0.0 --port=$PORT"
