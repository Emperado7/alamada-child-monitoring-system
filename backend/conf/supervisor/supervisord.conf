[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT

[program:nginx]
command=/usr/sbin/nginx -g "daemon off; error_log /dev/stderr info;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT

; Laravel task scheduler — runs every minute and dispatches scheduled jobs.
; The Kernel schedules app:keep-alive every 14 minutes to keep Render awake.
; - sleep 90 waits for start.sh to finish writing .env, migrating, and caching
; - || true prevents the loop from exiting on artisan errors (e.g. DB not ready)
; - autorestart=unexpected means supervisord won't restart it unless it exits
;   with a non-zero code that isn't in exitcodes (i.e. only on real crashes)
[program:laravel-scheduler]
command=/bin/sh -c "sleep 90 && while true; do (php /var/www/html/artisan schedule:run --no-ansi 2>&1 || true); sleep 60; done"
autorestart=unexpected
exitcodes=0
priority=20
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
