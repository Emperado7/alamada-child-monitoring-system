# nginx site config for the Laravel backend.
# `listen __PORT__` is replaced at runtime (start.sh) with Render's $PORT.
server {
    # Render provisions and terminates TLS; we only serve plain HTTP inside the container.
    listen __PORT__ default_server;

    server_name _;

    # Allow large uploads (child photos, etc.)
    client_max_body_size 100m;

    root /var/www/html/public;
    index index.php;

    sendfile off;

    # stdout/stderr so Render can capture logs
    access_log /dev/stdout;
    error_log  /dev/stdout info;

    charset utf-8;

    # Block access to version-control files
    location /.git {
        deny all;
        return 403;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Serve static assets with a short cache; never run PHP for these.
    location ~* \.(jpg|jpeg|gif|png|ico|webp|tiff|ttf|svg|css|js|woff2?)$ {
        expires 5d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny dotfiles (except well-known)
    location ~ /\.(?!well-known) {
        log_not_found off;
        deny all;
    }
}
